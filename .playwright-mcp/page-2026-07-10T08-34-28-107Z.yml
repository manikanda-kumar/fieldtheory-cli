          - article [ref=f2e505]:
            - generic [ref=f2e506]:
              - generic [ref=f2e507]:
                - generic [ref=f2e508]: Sudo su · @sudoingX
                - time [ref=f2e509]: Fri Jul 10 06:37:35 +0000 2026
              - generic [ref=f2e510]: List tweet
            - paragraph [ref=f2e511]: "i took qwen 3.6 27b dense, the king of the 24gb tier, for a full bench spin on my rtx 5090 laptop, head to head against a used $900 rtx 3090. some results i expected. one genuinely surprised me. the setup: q4_k_m, 16.8gb file, llama.cpp with flash attention, q4 kv cache, same flags on both cards, single stream, all measured this week on my own hardware. what i found: > 1. 35.3 tok/s generation fresh, 1,509 tok/s prompt processing on the laptop. > 2. the used $900 3090 beats the flagship laptop at generation, 40.1 against 35.3. generation is memory bandwidth, and the old card simply has more of it, 936 vs 896 GB/s. > 3. the laptop wins prompt processing by 16 percent. blackwell compute is real, it just isn't what generation is hungry for. > 4. filled context is the silent killer. 36 tok/s fresh glides to 18.8 by 128k deep and 12.9 at the full 262k. minus 64 percent. nobody benchmarks this and every agent user feels it. > 5. 128k context costs 18.7gb of vram, the sweet spot for agent work. the wall is 376k. and the footprint is identical on a 3090, 4090 and 5090 within 35 MiB. full picture in the chart, every flag included, everything reproducible. next up: the depth curve on its own, the measurement almost nobody publishes. stay close."
            - figure [ref=f2e513]:
              - img "Tweet media"
            - complementary [ref=f2e514]:
              - generic [ref=f2e515]: Quoted tweet
              - generic [ref=f2e516]: Sudo su · @sudoingX
              - paragraph [ref=f2e517]: "my ai setup is a gaming laptop, and i've stopped thinking of that as the budget option. i think it's the correct one. what's on screen right now: qwen 3.6 27b dense model served locally on the 5090 laptop, 18.6gb of the 24gb vram in use, an agent with 28 tools driving it at a 131k context window, about 39 tok/s, everything on localhost. no api key exists anywhere in this loop. my prompts, my tool calls, my code, none of it leaves the room. the laptop itself was gifted by someone from x, still the single greatest thing this app has done for me. and this week i finally built the cockpit around it: standing table, two g-sync monitors for 8,000 baht, and the most comfortable chair of my life for 7,500. the entire upgrade cost less than some people burn on api calls in a month. this desk is the whole office of a one person company. the 24gb tier keeps surprising me. it went from \"runs models\" to \"runs my daily driver with an agent on top\" in about six months, and i keep finding new ways to squeeze it. more experiments coming from this machine."
              - figure [ref=f2e519]:
                - img "Tweet media"
